name: Ship's log

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/scripts/ships-log.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - run: |
          git config user.name "ship's computer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md logbook.md log.json assets
          if ! git diff --cached --quiet; then
            git commit -m "Ship's log: new entry"
            git push
          fi
